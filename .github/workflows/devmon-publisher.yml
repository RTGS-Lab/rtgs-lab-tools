name: Device monitoring publisher

# Checks the MSI cron side on every PR that touches it and on every release tag the cron can be
# pinned to (devmon-v*). The cron itself runs on MSI; GitHub cannot reach MSI.

on:
  pull_request:
    paths:
      - "src/rtgs_lab_tools/device_monitoring/**"
      - "tests/device_monitoring/**"
      - ".github/workflows/devmon-publisher.yml"
  push:
    tags:
      - "devmon-v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cron script parses
        run: bash -n src/rtgs_lab_tools/device_monitoring/scheduled_device_monitoring.sh

      # Exactly what the MSI cron installs: if the publisher path gains an import that is not in
      # requirements-cron.txt, this job fails instead of the 04:27 run.
      - name: Install (lean, as the cron does)
        run: |
          python -m pip install --upgrade pip
          pip install -r src/rtgs_lab_tools/device_monitoring/requirements-cron.txt
          pip install --no-deps -e .
          pip install pytest jsonschema

      - name: Publisher tests
        run: pytest -q -o addopts= tests/device_monitoring

      - name: CLI takes the flags the cron passes
        run: |
          rtgs device-monitoring monitor --help | grep -q -- '--start-date'
          rtgs device-monitoring publish --help >/dev/null
          rtgs device-monitoring check-ingest --help >/dev/null
          python -m rtgs_lab_tools.device_monitoring.cli monitor --help | grep -q -- '--no-email'
          python -m rtgs_lab_tools.device_monitoring.cli check-ingest --help >/dev/null
