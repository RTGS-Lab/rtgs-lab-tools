# Public layers the Scoring Review V2 reads: fetch.py writes <public_root>/<registry key>/<key>.gpkg
# (county + 1 mile, EPSG:26915) with fetch.json (URL, sha256). Next to the 2020 model gdb; not git.
public_root: /home/rtgs/Documents/nrpc/data/registry
