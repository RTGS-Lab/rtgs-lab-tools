# Ranking. Kristine (relayed by Bryan 2026-11-10, 00-nrpc-v2-model-slides GOAL Decisions): protected
# areas "get an index score, but are not apart of the rank county wide". Scoring Review row 2,
# Proposed Layer Query: "make sure to remove the Airport parcels". Both keep Overall_Value; Rank_ranked
# is 0 for them. changes/exclusions.py builds the shares.
ranking:
  protected_set: sheet          # pa_sheet.SHEET_SOURCES; "explorer" = 2020 + easements + TRPD + parks NR
  protected_share: 0.5          # nrpc-model-explorer data/build-data.py PROTECTED_SHARE [NEEDS CONFIRM]
  airport_share: 0.5            # share of parcel in Generalized Land Use 2025 "Airport" [NEEDS CONFIRM]
  sheet:
  - {tab: Scoring Review and Recommendations, row: 2, col: "Proposed Layer Query - Geoprocessing Guide"}

